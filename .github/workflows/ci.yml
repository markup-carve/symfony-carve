name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job below carries a timeout-minutes bound. Without one a job inherits
# GitHub's 360-minute default, and a stalled step can burn hours unnoticed.
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            symfony: '6.4.*'
          - php: '8.3'
            symfony: '7.*'
          - php: '8.4'
            symfony: '7.*'
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Symfony version
        run: composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: PHPStan
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  code-style:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: PHPCS
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: PHP CodeSniffer
        run: vendor/bin/phpcs --colors -p
