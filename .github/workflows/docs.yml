name: Documentation

on:
  push:
    branches:
      - '0.1'
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

# The site is deployed from main, which builds this branch at the site root.
jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build with VitePress
        run: npm run docs:build
        working-directory: docs

  redeploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Redeploy the versioned site from main
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/deploy-docs.yml?ref=main" --silent; then
            echo "main has no deploy-docs.yml yet"
            exit 0
          fi
          gh workflow run deploy-docs.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
